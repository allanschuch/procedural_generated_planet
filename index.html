<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho CG - Planeta Procedural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="c"></canvas>
    
    <div id="uiContainer">
        <div class="ui-col">
            <div id="ui-planet" class="ui-group"><div class="ui-group-title">PLANET</div></div>
        </div>
        
        <div class="ui-col">
            <div id="ui-camera" class="ui-group"><div class="ui-group-title">CAMERA</div></div>
            <div id="ui-stones" class="ui-group"><div class="ui-group-title">STONES</div></div>
            <div id="ui-trees" class="ui-group"><div class="ui-group-title">TREES</div></div>
            <div id="ui-star" class="ui-group"><div class="ui-group-title">STAR AND LIGHTING</div></div>
        </div>
    </div>

    <script src="https://twgljs.org/dist/4.x/twgl-full.min.js"></script>
    <script src="https://webgl2fundamentals.org/webgl/resources/m4.js"></script>
    <script src="webgl-lessons-ui.js"></script>
    <script src="uiControl.js"></script>
    <script src="objects.js"></script>
    <script src="sceneGraph.js"></script>
    <script src="noise.js"></script>
    <script src="main.js"></script>
</body>
</html>
